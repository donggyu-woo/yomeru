<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>yomeru</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 300px; margin: 0; padding: 14px 16px; word-break: keep-all;
      font: 14px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    h1 { margin: 0 0 8px; font-size: 16px; }
    label { display: block; margin: 16px 0 4px; font-size: 12px; font-weight: 600; }
    select { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; font-size: 12px; }
    .hint { margin: 4px 0 0; font-size: 12px; opacity: .7; }
    select + .hint { margin-top: 16px; }
  </style>
</head>
<body>
  <h1>yomeru</h1>

  <p class="hint">선택한 영어·일본어를 Google 번역으로 보여주고, 단어는 네이버 사전에서 자세히 볼 수 있습니다.</p>

  <label for="trigger-mode">검색 방식</label>
  <select id="trigger-mode">
    <option value="auto">텍스트 선택 즉시 표시</option>
    <option value="button">텍스트 선택 시 「訳」 버튼 표시</option>
    <option value="menu">우클릭 메뉴로만 표시</option>
  </select>

  <p class="hint">※ 영어·일본어 → 한국어 번역만 지원합니다.</p>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
